[project]
name = "taizhou-voice-backend"
version = "0.1.0"
description = "泰州方言通 FastAPI 后端（Qwen3-ASR 识别服务）"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch==2.7.1",
    "torchaudio==2.7.1",
    "qwen-asr==0.0.6",
    "transformers==4.57.6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "librosa>=0.10",
    "soundfile>=0.12",
    "sqlalchemy>=2.0",
    "bcrypt>=5.0.0",
    "pyjwt>=2.13.0",
    "pyttsx3>=2.90",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
index-url = "https://pypi.org/simple"

# torch / torchaudio 不写死 CPU 源——部署时由 scripts/setup-torch.sh 按 GPU 环境单独安装
